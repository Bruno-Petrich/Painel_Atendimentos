<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Atendimentos - NucDash</title>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para icones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Nosso estilo base -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Bibliotecas de CSV e Leaflet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <style>
        .mapa-wrapper {
            width: 100%;
            height: calc(100vh - 180px); /* 100% da tela subtraindo o header */
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
        }
        
        #regions_div {
            width: 100%;
            height: 100%;
        }

        .btn-voltar {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-voltar:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Leaflet Dark Theme Hacks */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
        }
        .leaflet-container {
            font-family: 'Inter', sans-serif;
            background: #0f172a; /* Same as tailwind slate-900 */
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar" style="margin-bottom: 24px;">
                <div class="header-left">
                    <h1 class="page-title">Mapa de Calor Operacional</h1>
                    <p class="page-subtitle" id="mapTitle">Volume de Atendimentos por Unidade Federativa</p>
                </div>
                <div>
                    <button id="btnVoltarBrasil" class="btn-voltar hidden" style="margin-right: 12px; background: rgba(59, 130, 246, 0.2); border-color: var(--accent-blue);"><i class="fa-solid fa-map"></i> Ver Todo o Brasil</button>
                    <a href="index.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar ao Dashboard</a>
                </div>
            </header>

            <!-- Loading Spinner -->
            <div id="loader" class="loader-container">
                <div class="spinner"></div>
                <p>Processando malha geográfica...</p>
            </div>

            <div id="mapContainer" class="glass padding-24 hidden" style="padding: 24px;">
                <div class="mapa-wrapper">
                    <div id="regions_div"></div>
                </div>
            </div>
            
        </main>
    </div>

    <!-- Script próprio para desenhar mapa -->
    <script src="mapa.js"></script>
</body>
</html>
